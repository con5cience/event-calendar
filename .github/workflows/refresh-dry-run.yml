name: Locale refresh and deploy

on:
  workflow_dispatch:
    inputs:
      locale:
        description: Locale to refresh
        required: true
        type: choice
        options:
          - denver
        default: denver
      deploy:
        description: Commit the verified snapshot and deploy to Railway (main only)
        type: boolean
        default: true
      capture_concurrency:
        description: Maximum independent captures (shared providers remain serial)
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "3"

permissions:
  contents: read

concurrency:
  group: refresh-dry-run-${{ inputs.locale }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LOCALE: ${{ inputs.locale }}
      CAPTURE_CONCURRENCY: ${{ inputs.capture_concurrency }}
    steps:
      - name: Require main for deployment mode
        if: inputs.deploy
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Prepare isolated inputs
        run: |
          node --input-type=module -e 'import { validateLocaleID } from "./scripts/package-locale.mjs"; validateLocaleID(process.env.LOCALE);'
          mkdir -p "$RUNNER_TEMP/refresh-input/locales" dry-run-results
          cp -R "locales/$LOCALE" "$RUNNER_TEMP/refresh-input/locales/$LOCALE"
      - name: Build refresh image
        run: docker build --target refresh -t withadult-refresh-dry-run .
      - name: Refresh sources
        id: refresh
        env:
          ROXY_PROXY_URL: ${{ secrets.HTTP_PROXY }}
          ROXY_PROXY_REQUIRED: "1"
        run: |
          log_token=$(node --input-type=module -e 'import { randomUUID } from "node:crypto"; console.log(randomUUID());')
          printf '::stop-commands::%s\n' "$log_token"
          printf '%s\n' "$CAPTURE_CONCURRENCY" > dry-run-results/capture-concurrency.txt
          set +e
          docker run --rm --name withadult-refresh-capture -e CAPTURE_CONCURRENCY -e ROXY_PROXY_URL -e ROXY_PROXY_REQUIRED --mount "type=bind,src=$RUNNER_TEMP/refresh-input,dst=/repo" withadult-refresh-dry-run "$LOCALE" 2>&1 | tee dry-run-results/refresh.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf '::%s::\n' "$log_token"
          printf '%s\n' "${pipeline_status[0]}" > dry-run-results/refresh-exit-code.txt
          if [ "${pipeline_status[1]}" -ne 0 ]; then
            printf 'Unable to retain refresh log\n' >&2
            exit 1
          fi
          docker run --rm --entrypoint node --mount "type=bind,src=$RUNNER_TEMP/refresh-input,dst=/repo,readonly" --mount "type=bind,src=$GITHUB_WORKSPACE/dry-run-results,dst=/diagnostics" withadult-refresh-dry-run /tools/scripts/refresh-dry-run.mjs report "$LOCALE" /repo /diagnostics
          if [ -f dry-run-results/summary.md ]; then
            cat dry-run-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build refreshed application
        run: |
          docker run --rm --entrypoint node --mount "type=bind,src=$RUNNER_TEMP/refresh-input,dst=/repo" --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/checkout" withadult-refresh-dry-run --input-type=module -e 'import { cpSync } from "node:fs"; const id=process.argv[1]; cpSync(`/repo/locales/${id}/catalog`, `/checkout/locales/${id}/catalog`, { recursive:true });' "$LOCALE"
          docker build -f Dockerfile.railway --build-arg "LOCALE=$LOCALE" -t withadult-app-dry-run .
      - name: Verify running application
        id: smoke
        run: |
          docker run -d --name withadult-dry-run-app --read-only --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8097:8080 withadult-app-dry-run
          node scripts/refresh-dry-run.mjs smoke "$LOCALE" http://127.0.0.1:8097 dry-run-results/http-check.json
      - name: Save verified snapshot
        if: steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-${{ inputs.locale }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/refresh-input/locales/${{ inputs.locale }}/catalog/
          if-no-files-found: error
          retention-days: 7
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-${{ inputs.locale }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dry-run-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Flag partial refresh
        if: ${{ !inputs.deploy }}
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; const r=JSON.parse(readFileSync("dry-run-results/report.json","utf8")); if(r.status!=="success") { console.error("Partial refresh. Inspect the saved reports and snapshot."); process.exitCode=1; }'
      - name: Require all sources for deployment
        if: inputs.deploy
        run: node scripts/deploy-locale.mjs gate "$LOCALE" dry-run-results
      - name: Stop verification container
        if: always()
        run: |
          if docker container inspect withadult-dry-run-app >/dev/null 2>&1; then
            docker logs withadult-dry-run-app
            docker stop withadult-dry-run-app
          fi

  deploy:
    needs: dry-run
    if: inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      LOCALE: ${{ inputs.locale }}
    steps:
      - name: Check deployment credential
        env:
          RAILWAY_TOKEN: ${{ secrets.WITHADULT_RAILWAY_API_TOKEN }}
        run: test -n "$RAILWAY_TOKEN" || { echo 'Missing WITHADULT_RAILWAY_API_TOKEN Actions secret' >&2; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Preserve previous snapshot
        run: mv "locales/$LOCALE/catalog" "$RUNNER_TEMP/previous-catalog"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snapshot-${{ inputs.locale }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: locales/${{ inputs.locale }}/catalog/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: report-${{ inputs.locale }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-results/
      - name: Validate and package snapshot
        run: |
          node scripts/deploy-locale.mjs gate "$LOCALE" "$RUNNER_TEMP/deployment-results"
          node scripts/package-locale.mjs "$LOCALE" "$RUNNER_TEMP/railway-context"
      - name: Commit and push snapshot
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          node scripts/publish-snapshot.mjs "$LOCALE" "$EXPECTED_HEAD" > "$RUNNER_TEMP/deployment-results/snapshot-commit.txt"
          cat "$RUNNER_TEMP/deployment-results/snapshot-commit.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.26.2
      - name: Deploy and verify Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.WITHADULT_RAILWAY_API_TOKEN }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo 'Missing WITHADULT_RAILWAY_API_TOKEN Actions secret' >&2; exit 1; }
          project=$(node -p "require('./.github/railway-' + process.env.LOCALE + '.json').project")
          environment=$(node -p "require('./.github/railway-' + process.env.LOCALE + '.json').environment")
          service=$(node -p "require('./.github/railway-' + process.env.LOCALE + '.json').service")
          git fetch origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" || { echo 'main changed before deployment; start a new run' >&2; exit 1; }
          railway up "$RUNNER_TEMP/railway-context" --path-as-root --project "$project" --environment "$environment" --service "$service" --detach --json --message "Snapshot $(git rev-parse HEAD)" > "$RUNNER_TEMP/deployment-results/upload.json"
          node scripts/deploy-locale.mjs verify "$LOCALE" "$RUNNER_TEMP/deployment-results"
          cat "$RUNNER_TEMP/deployment-results/live-check.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Save deployment diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-${{ inputs.locale }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-results/
          if-no-files-found: warn
          retention-days: 7
