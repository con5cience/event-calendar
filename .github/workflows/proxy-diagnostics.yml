name: Roxy proxy diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roxy-proxy-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build diagnostic image
        run: docker build --platform linux/amd64 --target proxy-diagnostics -t withadult-proxy-diagnostics .
      - name: Test diagnostic reporting
        run: docker run --rm --entrypoint node withadult-proxy-diagnostics --test tests/proxy-diagnostics.test.mjs
      - name: Diagnose proxy
        timeout-minutes: 6
        env:
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        run: |
          mkdir -p proxy-results
          set -o pipefail
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true -e HTTP_PROXY withadult-proxy-diagnostics | tee proxy-results/diagnostics.jsonl
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proxy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: proxy-results/
          if-no-files-found: warn
          retention-days: 7
