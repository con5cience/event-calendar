services:
  app:
    build:
      context: .
      target: runtime
      args:
        LOCALE: ${CALENDAR_LOCALE:?Select a locale with --env-file locales/<id>/compose.env}
    ports:
      - "127.0.0.1:${CALENDAR_PORT:-8090}:8080"
    environment:
      WEEK_EVENT_LIMIT: ${WEEK_EVENT_LIMIT:-}
      MONTH_EVENT_LIMIT: ${MONTH_EVENT_LIMIT:-}
      DAY_EVENT_LIMIT: ${DAY_EVENT_LIMIT:-}
    volumes:
      - ${CALENDAR_DATA_DIR:-./.artifacts/${CALENDAR_LOCALE}}:/data:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Explicit publication only; no live adapters or scheduled jobs yet.
  # Uncomment to enable, then run: docker compose --env-file locales/<id>/compose.env run --rm ingestion publish ...
