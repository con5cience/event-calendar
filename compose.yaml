services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${CALENDAR_PORT:-8090}:8080"
    environment:
      WEEK_EVENT_LIMIT: ${WEEK_EVENT_LIMIT:-10}
      MONTH_EVENT_LIMIT: ${MONTH_EVENT_LIMIT:-5}
      DAY_EVENT_LIMIT: ${DAY_EVENT_LIMIT:-0}
    volumes:
      - ${CALENDAR_DATA_DIR:-./.artifacts}:/data:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Explicit publication only; no live adapters or scheduled jobs yet.
