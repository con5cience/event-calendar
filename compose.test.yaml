services:
  fixture-app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      CALENDAR_INITIAL_DATE: "2026-09-08"
    volumes:
      - ./tests/fixtures:/data:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
