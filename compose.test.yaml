services:
  fixture-app:
    build:
      context: .
      target: runtime
      args:
        LOCALE: denver
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      CALENDAR_INITIAL_DATE: "2026-09-08"
    volumes:
      - ./tests/fixtures:/data:ro
      - ./tests/fixtures/site.json:/app/site/site.json:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
