<!doctype html>
<html lang="en" data-color-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <title>withAdult()</title>
    <!-- Critical first-paint styles also work before the application CSS loads. -->
    <style>
      html {
        background: #0d0d0d;
        color: #e0e0e0;
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
      }
      #boot-status {
        display: none;
        padding: 36px max(12px, 5vw);
      }
      html.app-booting #boot-status {
        display: block;
      }
      html.app-booting .server-fallback {
        display: none;
      }
    </style>
    <script src="/assets/startup.js"></script>
  </head>
  <body>
    <div id="boot-status" role="status">Loading calendar…</div>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
